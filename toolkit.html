<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strategy Toolkit</title>
<!-- Fonts (DM Sans, DM Serif Display) are loaded by js/core/fonts.js so that offline use logs no errors. -->
<style>
/* ── css/00-design.css ── */
:root {
  --navy:   #0f2342;
  --cobalt: #1a3a6e;
  --sky:    #2563eb;
  --steel:  #64748b;
  --cloud:  #f1f5f9;
  --white:  #ffffff;
  --accent: #f59e0b;
  --green:  #10b981;
  --red:    #ef4444;
  --orange: #f97316;
  --text:   #1e293b;
  --muted:  #94a3b8;
  --border: #e2e8f0;
  --radius: 12px;
  --shadow:    0 4px 24px rgba(15,35,66,0.10);
  --shadow-lg: 0 12px 48px rgba(15,35,66,0.16);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  background: var(--navy);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(37,99,235,0.25) 0%, transparent 60%),
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255,255,255,0.02) 39px, rgba(255,255,255,0.02) 40px),
    repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255,255,255,0.02) 39px, rgba(255,255,255,0.02) 40px);
  min-height: 100vh;
  line-height: 1.7;
}

.tool-section .app-shell { max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; }

.tool-section .app-header { text-align: center; margin-bottom: 48px; }
.tool-section .app-header .eyebrow {
  display: inline-block; background: rgba(37,99,235,0.25); color: #93c5fd;
  font-size: 0.75rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
  padding: 6px 16px; border-radius: 999px; border: 1px solid rgba(147,197,253,0.25); margin-bottom: 20px;
}
.tool-section .app-header h1 {
  font-family: 'DM Serif Display', serif; font-size: clamp(2.2rem, 5vw, 3.4rem);
  color: var(--white); line-height: 1.1; margin-bottom: 14px;
}
.tool-section .app-header h1 em { font-style: italic; color: #93c5fd; }
.tool-section .app-header p { color: #94a3b8; font-size: 1.05rem; max-width: 520px; margin: 0 auto; line-height: 1.7; font-weight: 300; }

.tool-section .progress-bar-wrap { display: flex; align-items: center; margin-bottom: 40px; position: relative; }
.tool-section .progress-bar-wrap::before {
  content: ''; position: absolute; top: 18px; left: 0; right: 0; height: 2px; background: rgba(255,255,255,0.08); z-index: 0;
}
.tool-section .progress-bar-fill {
  position: absolute; top: 18px; left: 0; height: 2px; background: var(--sky); z-index: 1;
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
}
.tool-section .step-node { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; z-index: 2; }
.tool-section .step-node .bubble {
  width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.12);
  display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 700; color: var(--muted); transition: all 0.3s ease;
}
.tool-section .step-node.active .bubble { background: var(--sky); border-color: var(--sky); color: white; box-shadow: 0 0 0 4px rgba(37,99,235,0.25); }
.tool-section .step-node.done .bubble { background: var(--green); border-color: var(--green); color: white; }
.tool-section .step-node .step-label { font-size: 0.7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; transition: color 0.3s; }
.tool-section .step-node.active .step-label { color: #93c5fd; }
.tool-section .step-node.done .step-label { color: var(--green); }

.tool-section .card { background: var(--white); border-radius: 20px; box-shadow: var(--shadow-lg); overflow: hidden; animation: slideUp 0.4s cubic-bezier(0.4,0,0.2,1); }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.tool-section .card-header { background: linear-gradient(135deg, var(--navy) 0%, var(--cobalt) 100%); padding: 28px 36px; display: flex; align-items: center; gap: 16px; }
.tool-section .card-header h2 { font-family: 'DM Serif Display', serif; color: white; font-size: 1.5rem; }
.tool-section .card-header p { color: #94a3b8; font-size: 0.85rem; margin-top: 4px; font-weight: 300; }
.tool-section .card-header .icon {
  width: 48px; height: 48px; background: rgba(255,255,255,0.1); border-radius: 12px;
  display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0;
}
.tool-section .card-body { padding: 36px; }

.tool-section .step { display: none; }
.tool-section .step.active { display: block; }

.form-group { margin-bottom: 20px; }
.form-group label {
  display: block; font-size: 0.82rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--steel); margin-bottom: 8px;
}
input[type="text"], input[type="number"], textarea {
  width: 100%; padding: 13px 16px; border: 2px solid var(--border); border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif; font-size: 1rem; color: var(--text); background: var(--cloud);
  transition: border-color 0.2s, box-shadow 0.2s; outline: none;
}
input:focus, textarea:focus { border-color: var(--sky); box-shadow: 0 0 0 4px rgba(37,99,235,0.12); background: white; }
input.error { border-color: var(--red); box-shadow: 0 0 0 3px rgba(239,68,68,0.12); }
.error-msg { font-size: 0.8rem; color: var(--red); margin-top: 5px; font-weight: 500; }

.btn {
  padding: 13px 28px; border-radius: var(--radius); font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 700;
  cursor: pointer; border: 2px solid transparent; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px;
}
.btn-primary { background: var(--sky); color: white; box-shadow: 0 4px 16px rgba(37,99,235,0.30); }
.btn-primary:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(37,99,235,0.35); }
.btn-secondary { background: transparent; color: var(--steel); border-color: var(--border); }
.btn-secondary:hover { background: var(--cloud); color: var(--text); }
.btn-accent { background: var(--accent); color: white; box-shadow: 0 4px 16px rgba(245,158,11,0.30); }
.btn-accent:hover { background: #d97706; transform: translateY(-1px); }
.btn-row { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; margin-top: 28px; }

.hint-box {
  background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 18px 20px; margin-bottom: 28px;
  font-size: 0.85rem; color: #1e40af; line-height: 1.7;
}

.tool-section .remove-btn {
  width: 26px; height: 26px; border-radius: 6px; border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 1rem;
  display: flex; align-items: center; justify-content: center; transition: background 0.15s, color 0.15s; flex-shrink: 0;
}
.tool-section .remove-btn:hover { background: #fee2e2; color: var(--red); }
.tool-section .remove-btn:disabled { opacity: 0.2; cursor: not-allowed; }
.tool-section .add-btn {
  display: flex; align-items: center; gap: 5px; font-size: 0.78rem; font-weight: 700; color: var(--sky);
  background: rgba(37,99,235,0.08); border: 1.5px dashed rgba(37,99,235,0.3); border-radius: 8px; padding: 6px 12px;
  cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif;
}
.tool-section .add-btn:hover { background: rgba(37,99,235,0.15); border-color: var(--sky); }
.tool-section .add-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.tool-section .form-error {
  background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px;
  color: #dc2626; font-size: 0.85rem; font-weight: 500;
}

.tool-section .score-summary { background: white; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 28px; }
.tool-section .score-table { width: 100%; border-collapse: collapse; }
.tool-section .score-table th {
  background: var(--cloud); padding: 12px 20px; text-align: left; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--steel); border-bottom: 2px solid var(--border);
}
.tool-section .score-table td { padding: 14px 20px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
.tool-section .score-table tr:last-child td { border-bottom: none; }
.tool-section .score-table .dim-name { font-weight: 700; }
.tool-section .score-chip { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 28px; border-radius: 6px; font-size: 0.85rem; font-weight: 700; }
.tool-section .coord-row { background: var(--navy); }
.tool-section .coord-row td { border-bottom: none !important; padding: 16px 20px; color: white; }
.tool-section .coord-row .coord-pair { font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: #93c5fd; }

.tool-section .chart-wrap { background: white; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 28px; }
.tool-section .chart-topbar { background: linear-gradient(135deg, var(--navy) 0%, var(--cobalt) 100%); padding: 18px 24px; display: flex; align-items: center; gap: 12px; }
.tool-section .chart-topbar h3 { font-family: 'DM Serif Display', serif; color: white; font-size: 1.15rem; }
.tool-section .chart-topbar .chart-icon {
  width: 40px; height: 40px; background: rgba(255,255,255,0.1); border-radius: 10px;
  display: flex; align-items: center; justify-content: center; font-size: 1.2rem; flex-shrink: 0;
}
.tool-section .chart-body { padding: 28px; }

.tool-section .strategy-card { background: white; border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 28px; }
.tool-section .strategy-header { padding: 24px 28px 20px; border-bottom: 2px solid var(--border); display: flex; align-items: flex-start; gap: 16px; }
.tool-section .strategy-header .icon-big { font-size: 2rem; line-height: 1; }
.tool-section .strategy-header h3 { font-family: 'DM Serif Display', serif; font-size: 1.3rem; color: var(--text); margin-bottom: 4px; }
.tool-section .strategy-header p { color: var(--steel); font-size: 0.88rem; line-height: 1.6; }
.tool-section .strategy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.tool-section .strategy-item { padding: 20px 24px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); transition: background 0.15s; }
.tool-section .strategy-item:hover { background: var(--cloud); }
.tool-section .strategy-item:nth-child(even) { border-right: none; }
.tool-section .strategy-item:nth-last-child(-n+2) { border-bottom: none; }
.tool-section .strategy-item h4 { font-size: 0.88rem; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.tool-section .strategy-item p { font-size: 0.82rem; color: var(--steel); line-height: 1.6; }

.tool-section .print-alert { background: #fef2f2; border: 2px solid #fca5a5; border-radius: 12px; padding: 16px 24px; margin-bottom: 24px; text-align: center; }
.tool-section .print-alert p { color: #dc2626; font-size: 0.95rem; font-weight: 700; margin: 0; line-height: 1.6; }
.tool-section .print-note { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 20px; margin-bottom: 24px; }
.tool-section .print-note p { color: #334155; font-size: 0.9rem; font-weight: 500; margin: 0; line-height: 1.6; }

.print-only { display: none; }

@media (max-width: 620px) {
  .tool-section .strategy-grid { grid-template-columns: 1fr; }
}

@media print {
  body { background: white !important; color: black; }
  @page { margin: 1.5cm; }
  .no-print { display: none !important; }
  .print-only { display: block !important; }
  .tool-section .app-header, .tool-section .progress-bar-wrap, .tool-section .step1, .tool-section .step2 { display: none !important; }
  .tool-section .step3 { display: block !important; }
  .tool-section .card, .tool-section .chart-wrap, .tool-section .score-summary, .tool-section .strategy-card { box-shadow: none !important; border: 1px solid #ddd; }
  .tool-section .card-header, .tool-section .chart-topbar { background: #1a3a6e !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .tool-section .app-shell { padding: 0; max-width: 100%; }
  .tool-section canvas { max-width: 500px; margin: 0 auto; display: block; }
  .tool-section .strategy-item, .tool-section .score-summary, .tool-section .chart-wrap { break-inside: avoid; }
  .tool-section .strategy-grid { grid-template-columns: 1fr 1fr; }
  .tool-section .print-alert {
    background: #fef2f2 !important; border: 3px solid #dc2626 !important; border-radius: 0 !important; padding: 14px 20px; margin-bottom: 20px;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .tool-section .print-alert p { color: #dc2626 !important; font-size: 1rem; font-weight: 700; }
  .tool-section .print-note { background: #fff !important; border: 1px solid #94a3b8 !important; border-radius: 0 !important; padding: 10px 16px; margin-bottom: 20px; }
  .tool-section .print-note p { color: #334155 !important; font-weight: 400; }
  .tool-section .print-header { text-align: center; padding: 20px 0 30px; border-bottom: 3px solid #1a3a6e; margin-bottom: 24px; }
  .tool-section .print-header h1 { font-size: 1.8rem; color: #1a3a6e; font-family: 'DM Serif Display', serif; }
  .tool-section .print-header p { color: #666; font-size: 0.9rem; margin-top: 6px; }
}

/* ── css/10-app.css ── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 20px; background: rgba(10,25,48,0.92); border-bottom: 1px solid rgba(255,255,255,0.08);
  backdrop-filter: blur(6px);
}
.topbar .brand { font-family: 'DM Serif Display', serif; color: white; font-size: 1.2rem; margin-right: 6px; white-space: nowrap; }
.topbar .brand-company { color: #93c5fd; font-size: 0.85rem; font-weight: 500; margin-right: auto; max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .tb-btn {
  font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 700; color: #e2e8f0; cursor: pointer;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; padding: 7px 12px;
}
.topbar .tb-btn:hover { background: rgba(255,255,255,0.14); }
.topbar .file-status { font-size: 0.75rem; color: #94a3b8; white-space: nowrap; }
.app-notes { max-width: 1100px; margin: 0 auto; padding: 0 20px; }
.note-bar {
  margin-top: 12px; padding: 10px 16px; border-radius: 10px; font-size: 0.85rem; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
.note-bar.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
.note-bar.warn { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
.note-bar.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
.note-bar .btn { padding: 6px 14px; font-size: 0.8rem; }
.note-bar .note-close { margin-left: auto; background: none; border: none; color: inherit; cursor: pointer; font-size: 1rem; }

.home { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }
.home .home-header { text-align: center; margin: 12px 0 28px; }
.home .home-header h1 { font-family: 'DM Serif Display', serif; color: white; font-size: clamp(2rem, 4.5vw, 3rem); line-height: 1.1; }
.home .home-header h1 em { font-style: italic; color: #93c5fd; }
.home .home-header p { color: #94a3b8; max-width: 640px; margin: 10px auto 0; font-weight: 300; }
.home .panel { background: white; border-radius: 20px; box-shadow: var(--shadow-lg); padding: 24px 28px; margin-bottom: 24px; }
.home .panel h2 { font-family: 'DM Serif Display', serif; font-size: 1.3rem; margin-bottom: 14px; }
.home .company-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.home .howto { font-size: 0.88rem; color: var(--steel); }
.home .howto ul { margin: 6px 0 0 18px; }
.home .band { margin-bottom: 28px; }
.home .band h2 { color: #cbd5e1; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 12px; font-weight: 700; }
.home .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.tool-card {
  display: flex; flex-direction: column; gap: 6px; text-align: left; cursor: pointer;
  background: white; border: 2px solid transparent; border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow);
  font-family: 'DM Sans', sans-serif; color: var(--text);
}
.tool-card:hover, .tool-card:focus { border-color: var(--sky); outline: none; }
.tool-card .tc-name { font-family: 'DM Serif Display', serif; font-size: 1.25rem; line-height: 1.1; }
.tool-card .tc-full { font-size: 0.78rem; color: var(--steel); }
.tool-card .tc-status { align-self: flex-start; font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; letter-spacing: 0.02em; }
.tool-card[data-status="not-started"] .tc-status { background: var(--cloud); color: var(--steel); }
.tool-card[data-status="in-progress"] .tc-status { background: #eff6ff; color: #1d4ed8; }
.tool-card[data-status="done"] .tc-status { background: #dcfce7; color: #15803d; }
.tool-card[data-status="needs-attention"] .tc-status { background: #fef3c7; color: #b45309; }
.tool-card .tc-headline { font-size: 0.85rem; font-weight: 700; }
.tool-card .tc-headline .tc-value { font-family: 'DM Serif Display', serif; font-size: 1.05rem; margin-right: 6px; }
.tool-card .tc-next { font-size: 0.72rem; color: var(--muted); margin-top: auto; }
.tool-card .tc-badge { font-size: 0.75rem; color: #b45309; font-weight: 600; }

.tool-strip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; font-size: 0.82rem; }
.tool-strip button {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #cbd5e1; border-radius: 8px;
  padding: 5px 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 600;
}
.tool-strip button:hover { background: rgba(255,255,255,0.14); color: white; }
.tool-strip .back-to { background: var(--accent); border-color: var(--accent); color: white; margin-left: auto; }
.tool-strip .back-to:hover { background: #d97706; }

.link-slot { font-size: 0.78rem; line-height: 1.5; }
.link-slot:empty { display: none; }
.link-slot .lk { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 6px; padding: 6px 10px; border-radius: 8px; }
.link-slot .lk-info { background: #f8fafc; color: var(--steel); border: 1px dashed var(--border); }
.link-slot .lk-missing { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
.link-slot .lk-notice { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }
.link-slot .lk-badge { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; font-weight: 600; }
.link-slot button {
  font-family: 'DM Sans', sans-serif; font-size: 0.75rem; font-weight: 700; cursor: pointer; border-radius: 6px; padding: 3px 9px;
  border: 1px solid currentColor; background: white; color: inherit;
}
.link-slot button.lk-primary { background: var(--sky); border-color: var(--sky); color: white; }
.link-slot button.lk-text { border: none; background: none; text-decoration: underline; padding: 0 4px; }

.link-slot.section-slot { margin: 0 0 10px; }

.suggest-panel { background: #f5f3ff; border: 1px solid #ddd6fe; border-radius: 12px; padding: 12px 16px; margin: 0 0 18px; font-size: 0.8rem; color: #4c1d95; line-height: 1.5; }
.suggest-panel .sg-head { font-weight: 700; margin-bottom: 6px; }
.suggest-panel .sg-tag { font-weight: 500; font-size: 0.7rem; color: #6d28d9; background: #ede9fe; border-radius: 999px; padding: 1px 8px; margin-left: 6px; }
.suggest-panel .sg-missing { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.suggest-panel .sg-list { list-style: none; display: grid; gap: 4px; }
.suggest-panel .sg-list li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.suggest-panel .sg-list .sg-val { font-weight: 700; }
.suggest-panel .sg-note { color: #6d28d9; font-size: 0.75rem; margin-top: 6px; }
.suggest-panel .sg-btn {
  font-family: 'DM Sans', sans-serif; font-size: 0.75rem; font-weight: 700; cursor: pointer; border-radius: 6px; padding: 3px 9px;
  border: 1px solid #7c3aed; background: white; color: #6d28d9;
}
.suggest-panel .sg-btn:disabled { opacity: 0.45; cursor: default; }
.suggest-panel .sg-btn.sg-primary { background: #7c3aed; color: white; }
.sg-chip { display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; }

.coming-soon { text-align: center; color: var(--steel); padding: 24px; }

@media (max-width: 700px) {
  .home .company-grid { grid-template-columns: 1fr; }
}

@media print {
  .topbar, .app-notes, .home, .tool-strip, .link-slot { display: none !important; }
  body[data-print] main > .tool-section:not([data-tool-print]) { display: none !important; }
  body:not([data-print="all"]) #print-all { display: none !important; }
  body[data-print="all"] main > .tool-section, body[data-print="all"] .home { display: none !important; }

#print-all .print-page, #print-all [data-print-report] { break-before: page; page-break-before: always; }

(function (g) {
  'use strict';
  const isNode = typeof module === 'object' && module && module.exports;

  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];

  function monthYear(now) {
    const d = now || new Date();
    return MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function clone(o) { return o === undefined ? undefined : JSON.parse(JSON.stringify(o)); }

  function deepEqual(a, b) {
    if (a === b) return true;
    if (typeof a !== typeof b || a === null || b === null || typeof a !== 'object') return false;
    if (Array.isArray(a) !== Array.isArray(b)) return false;
    const ka = Object.keys(a), kb = Object.keys(b);
    if (ka.length !== kb.length) return false;
    return ka.every((k) => Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]));
  }

  // Highest number issued per prefix in this session, so a deleted row's id is never re-issued.
  const issued = {};
  function newId(prefix, rows, taken) {
    const used = new Set((rows || []).map((r) => r && r.id));
    if (taken) for (const t of taken) used.add(t);
    let n = issued[prefix] || 0;
    for (const id of used) {
      if (typeof id === 'string' && id.startsWith(prefix)) {
        const k = Number(id.slice(prefix.length));
        if (Number.isInteger(k) && k > n) n = k;
      }
    }
    n++;
    while (used.has(prefix + n)) n++;
    issued[prefix] = n;
    return prefix + n;
  }

  function linkedIds(project) {
    const ids = new Set();
    for (const [key, st] of Object.entries((project && project.links) || {})) {
      const k = key.split('.');
      if (k[2]) ids.add(k[2]);
      if (st && typeof st.src === 'string') { const s = st.src.split('.'); if (s[2]) ids.add(s[2]); }
    }
    return ids;
  }

  function companyFields(company) {
    const c = company || {};
    const t = (v) => String(v == null ? '' : v).trim();
    return { company: t(c.name), industry: t(c.industry), analyst: t(c.analyst), date: t(c.date) };
  }

  function num(v) { return parseFloat(v == null ? '' : String(v)); }

  const api = { MONTHS, monthYear, esc, clone, deepEqual, newId, linkedIds, companyFields, num };

(function (g) {
  'use strict';
  const isNode = typeof module === 'object' && module && module.exports;
  const util = isNode ? require('../core/util.js') : g.ST.util;

  function make(spec) {
    const [A, B] = spec.sections;

    function defaults() {
      const st = { step: 1, completed: false };
      for (const s of spec.sections) {
        st[s.id] = s.defaults.map((label, i) => ({ id: s.prefix + (i + 1), label, weight: '', rating: '' }));
      }
      return st;
    }

    function rowData(rows) {
      return (rows || []).map((row, i) => {
        const label = String(row.label == null ? '' : row.label).trim() || 'Factor ' + (i + 1);
        const weight = util.num(row.weight);
        const rating = util.num(row.rating);
        const weighted = (!isNaN(weight) && !isNaN(rating)) ? weight * rating : NaN;
        return { label, weight, rating, weighted };
      });
    }

    function compute(state, company) {
      const st = state || {};
      const errors = [];
      const warnings = [];
      const dataA = rowData(st[A.id]);
      const dataB = rowData(st[B.id]);
      const validA = dataA.filter((f) => !isNaN(f.weighted));
      const validB = dataB.filter((f) => !isNaN(f.weighted));
      if (validA.length === 0) errors.push(spec.errNone[0]);
      if (validB.length === 0) errors.push(spec.errNone[1]);
      let ratingError = false;
      dataA.forEach((f) => { if (!isNaN(f.rating) && (f.rating < A.ratingMin || f.rating > A.ratingMax)) ratingError = true; });
      dataB.forEach((f) => { if (!isNaN(f.rating) && (f.rating < B.ratingMin || f.rating > B.ratingMax)) ratingError = true; });
      if (ratingError) errors.push(spec.errRange);
      if (errors.length) return { ok: false, errors, warnings, results: null };

      const allValid = [...validA, ...validB];
      const weightSum = allValid.reduce((a, b) => a + b.weight, 0);
      const totalScore = allValid.reduce((a, b) => a + b.weighted, 0);
      if (Math.abs(weightSum - 1.0) >= 0.005) {
        warnings.push('⚠ RESULTS NOT VALID — Total weight is ' + weightSum.toFixed(2) +
          '. Weights must sum to 1.00 for results to be accurate.');
      }
      const results = {
        ...util.companyFields(company),
        [A.id]: validA,
        [B.id]: validB,
        weightSum,
        totalScore,
      };
      return { ok: true, errors, warnings, results };
    }

    function band(totalScore) {
      const shown = Number(totalScore.toFixed(2));
      return shown > 2.5 ? 'strong' : shown < 2.5 ? 'weak' : 'average';
    }

    function interpret(results) {
      const t = spec.text[band(results.totalScore)];
      return {
        label: t.label,
        tagline: t.tagline(results.company, results.totalScore.toFixed(2)),
        items: t.items.map((x) => ({ ...x })),
        emoji: t.emoji,
        color: t.color,
        heading: spec.text.heading,
      };
    }

    function headline(results) {
      return { value: results.totalScore.toFixed(2), label: spec.text[band(results.totalScore)].label };
    }

    function liveTotals(state) {
      let totalWeight = 0, totalWeighted = 0;
      for (const s of spec.sections) {
        for (const row of (state && state[s.id]) || []) {
          const w = util.num(row.weight), r = util.num(row.rating);
          if (!isNaN(w) && !isNaN(r)) { totalWeight += w; totalWeighted += w * r; } else if (!isNaN(w)) totalWeight += w;
        }

      return { totalWeight, totalWeighted };
    }

(function (g) {

  const util = isNode ? require('../core/util.js') : g.ST.util;

  const SECTIONS = ['strengths', 'weaknesses', 'opportunities', 'threats'];
  const ERRORS = {
    strengths: 'Enter at least 1 Strength factor.',
    weaknesses: 'Enter at least 1 Weakness factor.',
    opportunities: 'Enter at least 1 Opportunity factor.',
    threats: 'Enter at least 1 Threat factor.',
  };
  const MAX_ROWS = 10, MIN_ROWS = 1;

  function make(text) {
    function defaults() {
      const three = (p) => [1, 2, 3].map((n) => ({ id: p + n, text: '' }));
      return {
        step: 1, completed: false,
        strengths: three('s'), weaknesses: three('w'), opportunities: three('o'), threats: three('t'),
        strategies: { so: '', wo: '', st: '', wt: '' },
      };
    }

    const factors = (rows) => (rows || []).map((r) => String(r && r.text != null ? r.text : '').trim()).filter(Boolean);

    function compute(state, company) {
      const lists = {};
      const errors = [];
      for (const s of SECTIONS) {
        lists[s] = factors(state && state[s]);
        if (lists[s].length === 0) errors.push(ERRORS[s]);
      }
      if (errors.length) return { ok: false, errors, warnings: [], results: null };
      return { ok: true, errors, warnings: [], results: { ...util.companyFields(company), ...lists } };
    }

    function counts(r) {
      return { s: r.strengths.length, w: r.weaknesses.length, o: r.opportunities.length, t: r.threats.length };
    }

    function combos(r) {
      const c = counts(r);
      const list = text.combos.map((q) => ({ ...q, count: q.count(c) }));
      list.sort((a, b) => b.count - a.count);
      return list;
    }

    function interpret(r) {
      const c = counts(r);
      const sorted = combos(r);
      const t = text.insights(r.company, c, sorted);
      return { label: sorted[0].label, tagline: t.tagline, items: t.items, emoji: text.emoji, heading: text.heading };
    }

    function headline(r) {
      const c = counts(r);
      return { value: String(c.s + c.w + c.o + c.t), label: 'factors · strongest quadrant ' + combos(r)[0].type };
    }

    return { SECTIONS, MAX_ROWS, MIN_ROWS, defaults, compute, interpret, headline, combos, counts };
  }

  if (isNode) module.exports = api;
  else { g.ST = g.ST || {}; (g.ST.lib = g.ST.lib || {}).swot = api; }

(function (g) {
  'use strict';
  const ST = g.ST;
  const ui = ST.ui;
  const esc = ui.esc;

  const pad = (n) => String(n).padStart(2, '0');
  const timeText = (d) => d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

  function fileName(project, now) {
    const raw = String(project.company.name || '').trim() || 'Untitled';
    const safe = raw.replace(/[\/\\:"*?<>|\u0000-\u001f]/g, '_').replace(/\s+/g, ' ').slice(0, 80);
    return `${safe} - Strategy Toolkit - ${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}.json`;
  }

  ui.updateFileStatus = function () {
    const s = ST.store.status();
    const el = document.getElementById('fileStatus');
    if (!el) return;
    let text;
    if (!s.fileAt) text = 'Not saved to a file yet';
    else if (s.dirty) text = 'Changes since last save';
    else text = (s.fileKind === 'opened' ? 'Opened from file ' : 'Saved to file ') + timeText(s.fileAt);
    el.textContent = text;
    const co = document.getElementById('brandCompany');
    if (co) co.textContent = ST.store.get().company.name || '';
  };

  function showFileError(msg) {
    ui.setNote('fileError', msg == null ? null
      : `<div class="note-bar error" data-testid="file.error" role="alert"><span>${esc(msg)}</span>` +
        `<button type="button" class="note-close" data-act="note:close" data-note="fileError" aria-label="Dismiss">✕</button></div>`);
  }
  ui.on('note:close', (el) => ui.setNote(el.getAttribute('data-note'), null));

  ui.on('file:save', () => {
    const now = new Date();
    const project = ST.store.get();
    const blob = new Blob([ST.io.serialize(project, now)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName(project, now);
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    showFileError(null);
    ST.store.markFile('saved');
  });

  // "Replace the current project?" is asked when Open is clicked (before the file picker),
  // so the answer is known by the time the chosen file has been read.
  const REPLACE_MSG = 'Replace the current project? Changes not saved to a file will be lost.';
  let openDecision = null; // 'accepted' | 'declined' | null (drag and drop: ask after reading)

  ui.on('file:open', () => {
    if (ST.store.status().dirty) {
      openDecision = ui.confirm(REPLACE_MSG) ? 'accepted' : 'declined';
      if (openDecision === 'declined') return;
    } else openDecision = 'accepted';
    const input = document.getElementById('fileInput');
    input.value = '';
    input.click();
  });

  function openText(text, preConfirmed) {
    const r = ST.io.parse(text);
    if (!r.ok) { showFileError(r.error); return; }
    if (!preConfirmed && ST.store.status().dirty && !ui.confirm(REPLACE_MSG)) return;
    showFileError(null);
    ui.setNote('restore', null);
    ST.store.replace(r.project, { origin: 'file' });
    ST.store.markFile('opened');
    ST.router.go('#/home');
  }

  function readFile(file, preConfirmed) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => openText(String(reader.result || ''), preConfirmed);
    reader.onerror = () => showFileError('This file could not be read. It may be damaged or not a Strategy Toolkit project file.');
    reader.readAsText(file);
  }

  ui.initFile = function () {
    const input = document.getElementById('fileInput');
    input.addEventListener('change', () => {
      const decision = openDecision;
      openDecision = null;
      if (decision === 'declined') { input.value = ''; return; }
      readFile(input.files && input.files[0], decision === 'accepted');
    });
    // Drag and drop a saved file onto the page.
    document.addEventListener('dragover', (e) => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
    document.addEventListener('drop', (e) => {
      if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      e.preventDefault();
      readFile(e.dataTransfer.files[0], false);
    });
    g.addEventListener('beforeunload', (e) => {
      if (!ST.store.status().dirty) return undefined;
      e.preventDefault();
      e.returnValue = '';
      return '';
    });
  };

  ui.on('file:new', () => {
    if (!ui.confirm('Start a new project? This clears the current project. Save it to a file first if you want to keep it.')) return;
    ST.store.replace(ST.io.newProject(new Date()), { origin: 'action' });
    ST.router.go('#/home');
  });

  // ---- browser backup ------------------------------------------------------------------
  function isEmptyProject(p) {
    const c = p.company || {};
    if ([c.name, c.industry, c.analyst].some((v) => String(v || '').trim())) return false;
    if (p.links && Object.keys(p.links).length) return false;
    return ST.io.TOOLS.every((t) => !p.tools || !p.tools[t] || ST.links.isUntouched(p, t));
  }

  ui.initBackup = function () {
    if (!ST.autosave.isAvailable()) {
      ui.setNote('backupOff', '<div class="note-bar warn" data-testid="note.backupOff" role="status">Browser backup is off on this computer — use Save to file.</div>');
      return;
    }
    const b = ST.autosave.read();
    if (!b) return;
    const parsed = ST.io.parse(JSON.stringify(b.project));
    if (!parsed.ok || isEmptyProject(parsed.project)) return;
    const when = new Date(b.savedAt);
    const whenText = isNaN(when) ? 'earlier' : when.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
    const company = String(parsed.project.company.name || '').trim() || 'an untitled project';
    ui.setNote('restore', `<div class="note-bar info" data-testid="banner.restore" role="status">
      <span>Restore your work on ${esc(company)} from ${esc(whenText)}?</span>
      <button type="button" class="btn btn-primary" data-testid="banner.restore.restore" data-act="backup:restore">Restore</button>
      <button type="button" class="btn btn-secondary" data-testid="banner.restore.fresh" data-act="backup:fresh">Start fresh</button>
    </div>`);
    ui.on('backup:restore', () => {
      ui.setNote('restore', null);
      ST.store.replace(parsed.project, { origin: 'restore' });
    });
    ui.on('backup:fresh', () => ui.setNote('restore', null));
  };

  // Print toolkit (C14): see ui/printall.js.
})(typeof globalThis !== 'undefined' ? globalThis : this);

        const y = topPad + i * (barH + gap);
        const barW = (f.weighted / maxWS) * barAreaW;
        ctx.fillStyle = '#475569';
        ctx.font = '500 12px DM Sans, sans-serif';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(f.label.length > 24 ? f.label.substring(0, 22) + '...' : f.label, leftPad - 12, y + barH / 2);
        ctx.fillStyle = f.color;
        ctx.globalAlpha = 0.85;
        roundRect(ctx, leftPad, y, barW, barH, 4);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = f.color;
        ctx.font = '700 11px DM Sans, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(f.weighted.toFixed(2), leftPad + barW + 8, y + barH / 2);
      });
      if (Math.abs(r.weightSum - 1.0) >= 0.005) {
        const warnY = topPad + all.length * (barH + gap) + 8;
        const warnH = 32;
        if (warnY + warnH + 10 > canvas.height) {
          // Resizing clears the canvas, so redraw everything at the new height.
          canvas.height = warnY + warnH + 10;
          return drawChart(canvas, r);
        }
        ctx.fillStyle = '#fef2f2';
        ctx.fillRect(leftPad - 10, warnY, barAreaW + rightPad, warnH);
        ctx.strokeStyle = '#dc2626';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(leftPad - 10, warnY, barAreaW + rightPad, warnH);
        ctx.fillStyle = '#dc2626';
        ctx.font = 'bold 12px DM Sans, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('⚠ RESULTS NOT VALID — Weights total ' + r.weightSum.toFixed(2) + ' (must equal 1.00)', leftPad + barAreaW / 2, warnY + warnH / 2);
      }
      return undefined;
    }

    ui.registerTool({
      id: tool, name: tool.toUpperCase(),
      titleHtml: cfg.titleHtml, subtitle: cfg.subtitle,
      stepLabels: ['Company', 'Factors', 'Results'],
      step1Hint: cfg.step1Hint, step1Button: 'Continue to Factors',
      step2: cfg.step2, printTitle: cfg.printTitle,
      renderStep2, refreshStep2, renderStep3, afterStep3, drawChart,
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
  ui.roundRect = roundRect;

  // Row actions shared by both tools.
  ui.on('factor:add', (el) => {
    const tool = el.getAttribute('data-tool'), sec = el.getAttribute('data-section');
    const s = ST.calc[tool].SPEC.sections.find((x) => x.id === sec);

    const tool = el.getAttribute('data-tool'), sec = el.getAttribute('data-section'), id = el.getAttribute('data-row');

      const rows = p.tools[tool][sec];
      if (rows.length <= MIN_ROWS) return;
      p.tools[tool][sec] = rows.filter((r) => r.id !== id);
    });
  });

  make('efe');
})(typeof globalThis !== 'undefined' ? globalThis : this);

  const BAR_PATTERNS = [

    (g) => { g.lineWidth = 3.5; g.beginPath(); for (let i = -8; i <= 16; i += 8) { g.moveTo(i, 8); g.lineTo(i + 8, 0); } g.stroke(); }, // diagonal
    (g) => { g.beginPath(); g.arc(4, 4, 1.5, 0, Math.PI * 2); g.fill(); }, // dots
    (g) => { g.lineWidth = 1.5; g.beginPath(); g.moveTo(4, 0); g.lineTo(4, 8); g.moveTo(0, 4); g.lineTo(8, 4); g.stroke(); }, // grid

    'repeating-linear-gradient(0deg, rgba(255,255,255,0.85) 0 2px, transparent 2px 5px)',

  function barPattern(ctx, i) {
    const draw = BAR_PATTERNS[i % BAR_PATTERNS.length];
    if (!draw || typeof document === 'undefined') return null;
    const t = document.createElement('canvas');
    t.width = 8; t.height = 8;
    const g = t.getContext('2d');
    if (!g) return null;

    const warnH = 32;
    canvas.height = warn ? H + warnH + 10 : H;
    ctx.clearRect(0, 0, W, canvas.height);
    const pad = { top: 20, right: 30, bottom: 80, left: 50 };
    const cw = W - pad.left - pad.right;
    const ch = H - pad.top - pad.bottom;
    const nCSF = r.csfs.length;
    const nCo = r.companies.length;
    const groupW = cw / nCSF;
    const barW = Math.min(groupW / (nCo + 1), 28);

      ctx.fillStyle = '#94a3b8'; ctx.font = '10px DM Sans, sans-serif'; ctx.textAlign = 'right';
      ctx.fillText((maxWS * i / 5).toFixed(2), pad.left - 6, y + 3);
    }
    r.csfs.forEach((f, fi) => {
      const gx = pad.left + fi * groupW + groupW / 2;
      r.companies.forEach((c, ci) => {
        const ws = f.weight * f.ratings[ci];
        const barH = (ws / maxWS) * ch;
        const bx = gx - (nCo * barW) / 2 + ci * barW;
        const by = pad.top + ch - barH;
        ctx.fillStyle = c.color + 'cc';
        ui.roundRect(ctx, bx, by, barW - 2, barH, 3);
        ctx.fill();
        const pat = barPattern(ctx, ci);
        if (pat) { ctx.fillStyle = pat; ctx.fill(); }
        if (barH > 14) {
          ctx.fillStyle = c.color; ctx.font = 'bold 10px DM Sans, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(ws.toFixed(2), bx + (barW - 2) / 2, by - 4);
        }
      });
      ctx.fillStyle = '#475569'; ctx.font = '500 10px DM Sans, sans-serif'; ctx.textAlign = 'center';
      const short = f.label.length > 14 ? f.label.substring(0, 12) + '..' : f.label;
      ctx.save(); ctx.translate(gx, pad.top + ch + 12); ctx.rotate(Math.PI / 6);
      ctx.textAlign = 'left'; ctx.fillText(short, 0, 0); ctx.restore();
    });
    if (warn) {
      const warnY = H - 18;
      ctx.fillStyle = '#fef2f2';
      ctx.fillRect(pad.left, warnY, cw, warnH);
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(pad.left, warnY, cw, warnH);
      ctx.fillStyle = '#dc2626';
      ctx.font = 'bold 12px DM Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⚠ RESULTS NOT VALID — Weights total ' + r.totalWeight.toFixed(2) + ' (must equal 1.00)', pad.left + cw / 2, warnY + warnH / 2);

    if (nHist < n) svg += `<rect x="${x(nHist - 0.5)}" y="0" width="${W - x(nHist - 0.5)}" height="${H}" fill="#f8fafc"/>`;
    if (hist.length > 1) svg += `<polyline points="${line(hist)}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke"/>`;
    if (proj.length > 1 && nHist < n) svg += `<polyline points="${line(proj)}" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>`;
    pts.forEach((p) => { svg += `<circle cx="${x(p.i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="2.8" fill="${p.i < nHist ? color : '#fff'}" stroke="${color}" stroke-width="1.5"/>`; });

    var ctx = canvas.getContext('2d');
    if (!ctx) return;
    var W = 700, H = 700;
    ctx.clearRect(0, 0, W, H);

    var cx = W / 2, cy = H / 2;
    var scale = 55; // pixels per unit
    var maxR = 5;
    var gridExtent = maxR * scale; // 275px each direction

    // Background
    ctx.fillStyle = '#fafbfc';
    ctx.fillRect(0, 0, W, H);

    // Quadrant fills (very subtle)
    var quadFills = [
      { x: cx, y: 0, w: cx, h: cy, color: 'rgba(22,163,74,0.04)' },   // Q1 top-right
      { x: 0, y: 0, w: cx, h: cy, color: 'rgba(124,58,237,0.04)' },    // Q2 top-left
      { x: 0, y: cy, w: cx, h: cy, color: 'rgba(220,38,38,0.04)' },    // Q3 bottom-left
      { x: cx, y: cy, w: cx, h: cy, color: 'rgba(37,99,235,0.04)' }    // Q4 bottom-right
    ];

    // Determine occupied quadrants for opportunity gap highlighting
    var occupiedQuadrants = {};
    results.brands.forEach(function(b) {
      occupiedQuadrants[calc.getQuadrantIndex(b.x, b.y)] = true;
    });

    // Draw quadrant fills with opportunity gap wash
    quadFills.forEach(function(q, i) {
      var qIndex = [1, 2, 3, 4][i];
      ctx.fillStyle = q.color;
      ctx.fillRect(q.x, q.y, q.w, q.h);
      // Opportunity gap: subtle yellow wash for empty quadrants
      if (!occupiedQuadrants[qIndex]) {
        ctx.fillStyle = 'rgba(245,158,11,0.06)';
        ctx.fillRect(q.x, q.y, q.w, q.h);
      }
    });

    // Grid lines
    ctx.strokeStyle = 'rgba(0,0,0,0.06)';
    ctx.lineWidth = 1;
    for (var i = -maxR; i <= maxR; i++) {
      ctx.beginPath();
      ctx.moveTo(cx + i * scale, cy - gridExtent);
      ctx.lineTo(cx + i * scale, cy + gridExtent);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx - gridExtent, cy + i * scale);
      ctx.lineTo(cx + gridExtent, cy + i * scale);
      ctx.stroke();
    }

    // Axes (bold)
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(cx - gridExtent - 15, cy);
    ctx.lineTo(cx + gridExtent + 15, cy);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx, cy + gridExtent + 15);
    ctx.lineTo(cx, cy - gridExtent - 15);
    ctx.stroke();

    // Arrowheads
    function arrowhead(x, y, angle) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-12, -6); ctx.lineTo(-12, 6);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    arrowhead(cx + gridExtent + 15, cy, 0);
    arrowhead(cx, cy - gridExtent - 15, -Math.PI / 2);

    // Tick marks and numbers
    ctx.fillStyle = '#64748b';
    ctx.font = '11px DM Sans, sans-serif';
    ctx.textAlign = 'center';
    for (var t = -maxR; t <= maxR; t++) {
      if (t === 0) continue;
      // X ticks
      ctx.strokeStyle = '#1e293b'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx + t * scale, cy - 5);
      ctx.lineTo(cx + t * scale, cy + 5);
      ctx.stroke();
      ctx.fillStyle = '#64748b';
      ctx.textAlign = 'center';
      ctx.fillText(t, cx + t * scale, cy + 20);

      // Y ticks
      ctx.beginPath();
      ctx.moveTo(cx - 5, cy - t * scale);
      ctx.lineTo(cx + 5, cy - t * scale);
      ctx.stroke();
      ctx.textAlign = 'right';
      ctx.fillText(t, cx - 10, cy - t * scale + 4);
    }

    // Axis endpoint labels
    ctx.fillStyle = '#1e293b';
    ctx.font = 'bold 13px DM Sans, sans-serif';

    // X axis: left and right labels
    ctx.textAlign = 'left';
    ctx.fillText(results.xLeftLabel, cx - gridExtent - 10, cy + 38);
    ctx.textAlign = 'right';
    ctx.fillText(results.xRightLabel, cx + gridExtent + 10, cy + 38);

    // X axis name (bottom center)
    ctx.textAlign = 'center';
    ctx.font = 'bold 14px DM Sans, sans-serif';
    ctx.fillText(results.xAxisName, cx, H - 16);

    // Y axis: top and bottom labels
    ctx.font = 'bold 13px DM Sans, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(results.yTopLabel, cx, cy - gridExtent - 26);
    ctx.fillText(results.yBottomLabel, cx, cy + gridExtent + 36);

    // Y axis name (left side, rotated)
    ctx.save();
    ctx.font = 'bold 14px DM Sans, sans-serif';
    ctx.translate(18, cy);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = 'center';
    ctx.fillText(results.yAxisName, 0, 0);
    ctx.restore();

    // Plot brands — competitors first, then own company on top
    var sorted = results.brands.slice().sort(function(a, b) {
      return (a.isOwn ? 1 : 0) - (b.isOwn ? 1 : 0);
    });

    var compIdx = 0;
    sorted.forEach(function(b) {
      var px = cx + b.x * scale;
      var py = cy - b.y * scale;
      var color, radius, outerRadius;

      if (b.isOwn) {
        color = calc.OWN_COLOR;
        radius = 9;
        outerRadius = 18;
      } else {
        color = calc.COMP_COLORS[compIdx % calc.COMP_COLORS.length];
        compIdx++;
        radius = 7;
        outerRadius = 14;
      }

      // Outer ring
      ctx.fillStyle = color + '33';
      ctx.beginPath();
      ctx.arc(px, py, outerRadius, 0, 2 * Math.PI);
      ctx.fill();

      // Inner dot
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(px, py, radius, 0, 2 * Math.PI);
      ctx.fill();

      // White center
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(px, py, radius * 0.4, 0, 2 * Math.PI);
      ctx.fill();

      // Label above with background pill
      var label = b.name.length > 18 ? b.name.substring(0, 16) + '..' : b.name;
      ctx.font = (b.isOwn ? 'bold ' : '') + '12px DM Sans, sans-serif';
      var tw = ctx.measureText(label).width;
      var lbx = px - tw / 2 - 6;
      var lby = py - outerRadius - 18;

      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(lbx, lby, tw + 12, 20, 4);
      else ctx.rect(lbx, lby, tw + 12, 20);
      ctx.fill();
      ctx.strokeStyle = color + '50';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.fillText(label, px, lby + 14);
    });
  }

    return `<div class="score-summary"><div class="qspm-table-scroll"><table class="score-table"><thead>${head}</thead><tbody>${body}</tbody><tbody>${totals}</tbody></table></div></div>
      <div class="chart-wrap">
        <div class="chart-topbar"><div class="chart-icon">📊</div><h3>Strategy Comparison</h3></div>
        <div class="chart-body"><canvas class="qspm-canvas" width="700" height="350" style="width:100%;height:auto;" role="img" aria-label="QSPM strategy comparison chart"></canvas></div>

  function drawChart(canvas, results) {
    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    const r = results;

    const numBars = r.strategyCount;
    const barH = 48;
    const gap = 20;
    const topPad = 40;
    const bottomPad = 50;
    const leftPad = 180;
    const rightPad = 100;

    // Adjust canvas height
    const neededH = topPad + numBars * (barH + gap) + bottomPad + (r.weightFailures.length ? 50 : 0);
    canvas.height = Math.max(350, neededH);
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = '#fafbfc';
    ctx.fillRect(0, 0, W, H);

    const maxTas = Math.max(...r.tas, 1);
    const barAreaW = W - leftPad - rightPad;
    const win = calc.winnerIndex(r); // D3: null on a Strategic Tie, so no RECOMMENDED badge

    // Chart title
    ctx.fillStyle = '#0f2342';
    ctx.font = 'bold 14px DM Sans, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('Total Attractiveness Score (TAS) Comparison', W / 2, 20);

    // Grid lines
    const xScale = barAreaW / (maxTas * 1.15);
    const gridStep = maxTas > 4 ? 1 : 0.5;
    ctx.strokeStyle = '#e2e8f0';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    for (let v = gridStep; v <= maxTas * 1.15; v += gridStep) {
      const x = leftPad + v * xScale;
      ctx.beginPath();
      ctx.moveTo(x, topPad - 5);
      ctx.lineTo(x, topPad + numBars * (barH + gap));
      ctx.stroke();
      // Label
      ctx.fillStyle = '#94a3b8';
      ctx.font = '500 10px DM Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(v.toFixed(1), x, topPad + numBars * (barH + gap) + 4);
    }
    ctx.setLineDash([]);

    // X axis label
    ctx.fillStyle = '#64748b';
    ctx.font = '600 11px DM Sans, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillText('Total Attractiveness Score', leftPad + barAreaW / 2, topPad + numBars * (barH + gap) + 22);

    // Draw bars
    for (let i = 0; i < numBars; i++) {
      const y = topPad + i * (barH + gap);
      const barW = Math.max(2, r.tas[i] * xScale);
      const isWinner = i === win;

      // Strategy label
      ctx.fillStyle = COLORS[i];
      ctx.font = '700 12px DM Sans, sans-serif';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      const nameText = r.strategyNames[i].length > 22
        ? r.strategyNames[i].substring(0, 20) + '...'
        : r.strategyNames[i];
      ctx.fillText(nameText, leftPad - 14, y + barH / 2);

      // Bar
      ctx.fillStyle = COLORS[i];
      ctx.globalAlpha = 0.85;
      roundRect(ctx, leftPad, y, barW, barH, 6);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Bar gradient overlay
      const grad = ctx.createLinearGradient(leftPad, y, leftPad + barW, y);
      grad.addColorStop(0, 'rgba(255,255,255,0.15)');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      roundRect(ctx, leftPad, y, barW, barH, 6);
      ctx.fill();

      // TAS value at end of bar
      ctx.fillStyle = COLORS[i];
      ctx.font = 'bold 13px DM Sans, sans-serif';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(r.tas[i].toFixed(2), leftPad + barW + 8, y + barH / 2);

      // Winner badge
      if (isWinner) {
        const badgeX = leftPad + barW + 50;
        const badgeY = y + barH / 2;
        ctx.fillStyle = '#fef9c3';
        roundRect(ctx, badgeX, badgeY - 10, 120, 20, 10);
        ctx.fill();
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 1;
        roundRect(ctx, badgeX, badgeY - 10, 120, 20, 10);
        ctx.stroke();
        ctx.fillStyle = '#a16207';
        ctx.font = 'bold 10px DM Sans, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('\u2B50 RECOMMENDED', badgeX + 60, badgeY);
      }
    }

    // Weight warning overlay on canvas
    if (r.weightFailures.length) {
      const warnY = topPad + numBars * (barH + gap) + 38;
      const warnH = 32;
      const warnX = leftPad - 10;
      const warnW = barAreaW + rightPad;

      ctx.fillStyle = '#fef2f2';
      ctx.fillRect(warnX, warnY, warnW, warnH);
      ctx.strokeStyle = '#dc2626';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(warnX, warnY, warnW, warnH);

      ctx.fillStyle = '#dc2626';
      ctx.font = 'bold 11px DM Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(
        '\u26A0 RESULTS NOT VALID \u2014 ' + r.weightFailures.join('; '),
        warnX + warnW / 2, warnY + warnH / 2
      );
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  ui.registerTool({
    id: 'qspm', name: 'QSPM',
    titleHtml: 'QSPM <em>Analysis</em>',
    subtitle: 'Objectively evaluate competing strategic alternatives to determine which strategy best leverages key factors.',
    stepLabels: ['Strategies', 'Factors', 'Results'],
    step1Hint: '<strong>How the QSPM works:</strong><br>The Quantitative Strategic Planning Matrix is the most analytical tool in the strategy formulation framework. You will enter <strong>key internal and external factors</strong> (from your IFE/EFE analyses) along with their <strong>weights</strong>. Then, for each factor, you assign an <strong>Attractiveness Score (1-4)</strong> for each strategy. The tool calculates a <strong>Total Attractiveness Score (TAS)</strong> for each strategy &mdash; the highest TAS indicates the best strategic alternative.',
    step1Button: 'Continue to Factors',
    step2: { icon: '📊', title: 'QSPM Factor Scoring', sub: 'Enter factors, weights, and attractiveness scores for each strategy' },
    printTitle: 'QSPM Analysis',
    renderStep1Extras, validateStep1, renderStep2, refreshStep2, renderStep3,
    afterStep3: (section, project, out) => { const c = section.querySelector('canvas.qspm-canvas'); if (c) drawChart(c, out.results); },
    drawChart,
  });

  // ---- actions -------------------------------------------------------------------------------
  ui.on('qspm:addStrategy', () => {
    ST.store.update((p) => {

      st.strategies.push({ id: ST.util.newId('q', st.strategies, ST.util.linkedIds(p)), name: '' });
      for (const pool of ['internal', 'external']) for (const r of st[pool]) { r.as = r.as || []; while (r.as.length < st.strategies.length) r.as.push(''); }
    });

    const input = document.querySelector(`[data-testid="qspm.strategies.${n - 1}.name"]`);

    const home = document.getElementById('home');
    document.querySelectorAll('main > .tool-section').forEach((s) => {
      if (r.view === 'tool' && s.dataset.tool === r.tool) return;
      if (!s.hidden || s.innerHTML) { s.hidden = true; s.innerHTML = ''; delete s.dataset.step; }
    });
    if (r.view === 'home') {
      home.hidden = false;
      ui.renderHome();
    } else {
      home.hidden = true;
      home.innerHTML = '';
      const section = document.getElementById('tool-' + r.tool);
      section.hidden = false;
      if (!ui.renderTool(r.tool, r.step)) return;
    }
    ui.updateFileStatus();
  }

  function onChange(project, o) {
    ST.autosave.schedule();
    if (o.origin === 'silent') { ui.updateFileStatus(); return; }
    if (o.origin === 'input') {
      const r = ST.router.current();
      if (r.view === 'home') ui.refreshHome();
      else ui.refreshTool(r.tool);
      ui.updateFileStatus();
      return;
    }
    render();
  }

  function boot() {
    ST.store.replace(ST.io.newProject(new Date()), { origin: 'init' });
    ST.store.subscribe((p, o) => {
      if (o.origin === 'init') return;
      if (o.origin === 'file-status') { ui.updateFileStatus(); return; }
      onChange(p, o);
    });
    ui.initDelegation();
    ui.initFile();
    ui.initBackup();
    ST.router.init(render);
    render();
    ST.fonts.load();
  }

  // Canvas charts are drawn once; redraw them when the web fonts arrive.
  let fontTimer = null;
  ui.onFontsChanged = () => {
    clearTimeout(fontTimer);
    fontTimer = setTimeout(() => {
      const r = ST.router.current();
      if (r.view !== 'tool') return;
      const section = document.getElementById('tool-' + r.tool);
      const def = ui.toolDef(r.tool);
      if (section.dataset.step !== '3' || !def.afterStep3) return;
      const p = ST.store.get();
      const out = ST.calc[r.tool].compute(p.tools[r.tool], p.company, p);
      if (out.ok) def.afterStep3(section, p, out);
    }, 250);
  };

  ST.debug = {
    getProject: () => ST.util.clone(ST.store.get()),
    setProject: (p) => ST.store.replace(ST.util.clone(p), { origin: 'debug' }),
    reset: () => ST.store.replace(ST.io.newProject(new Date()), { origin: 'debug' }),
  };

  // The script sits at the end of <body>, so the DOM it needs already exists.
  boot();
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>
</body>
</html>
